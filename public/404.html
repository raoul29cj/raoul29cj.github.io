<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#080d16" />
    <title>Page introuvable — Raoul.CJ</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #080d16;
        color: #edf3ff;
        font-family: system-ui, sans-serif;
      }
      main {
        padding: 35px;
        max-width: 620px;
      }
      strong {
        font-size: clamp(90px, 20vw, 180px);
        color: #a9ceff55;
        letter-spacing: -8px;
      }
      h1 {
        font-size: clamp(32px, 6vw, 55px);
        line-height: 1.1;
      }
      p {
        color: #a8b7cd;
        line-height: 1.8;
      }
      a {
        display: inline-block;
        margin-top: 20px;
        padding: 14px 20px;
        border-radius: 10px;
        background: #a9ceff;
        color: #10233c;
        text-decoration: none;
        font-weight: 600;
      }
      a:focus-visible {
        outline: 3px solid #ffb078;
        outline-offset: 5px;
      }
    </style>
  </head>
  <body>
    <main>
      <strong>404.</strong>
      <h1>Cette page a pris<br />un autre chemin.</h1>
      <p>Le lien est peut-être incomplet ou la page n’existe plus.</p>
      <a href="/">Revenir à l’accueil</a>
    </main>
  </body>
</html>
